name: snapshot

on:
  schedule:
    - cron: "0 6 * * 1"   # lundi 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Télécharger et archiver
        run: |
          set -euo pipefail
          stamp=$(date -u +%F)
          iso=$(date -u +%G-W%V)

          # Idempotence : un seul snapshot par semaine ISO
          for f in snapshots/alimconfiance_*.csv.gz; do
            [ -e "$f" ] || continue
            d=$(basename "$f" | sed -E 's/alimconfiance_([0-9-]+)\.csv\.gz/\1/')
            if [ "$(date -u -d "$d" +%G-W%V)" = "$iso" ]; then
              echo "Snapshot déjà présent pour la semaine $iso ($f) — rien à faire."
              exit 0
            fi
          done

          curl -sSL --fail --retry 3 --max-time 600 -o tmp.csv \
            'https://dgal.opendatasoft.com/explore/dataset/export_alimconfiance/download/?format=csv&timezone=Europe/Berlin&use_labels_for_header=true'

          # Garde-fous : jamais archiver une page d'erreur ou un fichier tronqué
          size=$(stat -c%s tmp.csv)
          [ "$size" -ge 10000000 ] || { echo "fichier suspect : $size octets"; exit 1; }
          head -c 4000 tmp.csv | grep -q 'Synthese_eval_sanit' || { echo "en-tête inattendu"; exit 1; }

          mkdir -p snapshots
          gzip -9 -c tmp.csv > "snapshots/alimconfiance_${stamp}.csv.gz"
          rm tmp.csv

          git config user.name "snapshot-bot"
          git config user.email "actions@github.com"
          git add snapshots/
          git commit -m "snapshot ${stamp} (${size} octets bruts)"
          git push
